  <!-- Head -->
  <ellipse cx="470" cy="416" rx="235" ry="205" fill="url(#fur)" stroke="#42281f" stroke-width="20"/>

  <!-- Eyes -->
  <ellipse cx="391" cy="380" rx="35" ry="44" fill="#1c1715"/>
  <ellipse cx="549" cy="380" rx="35" ry="44" fill="#1c1715"/>
  <circle cx="401" cy="366" r="11" fill="white"/>
  <circle cx="559" cy="366" r="11" fill="white"/>

  <!-- Bill -->
  <path d="M305 465
           C306 412 367 404 469 421
           C565 404 653 421 654 465
           C655 515 580 560 472 558
           C372 560 304 515 305 465Z"
        fill="#eea443" stroke="#42281f" stroke-width="18"/>
  <path d="M468 429 L468 543" stroke="#ba6f2d" stroke-width="12" stroke-linecap="round"/>
  <path d="M386 489 C410 506 434 511 451 508
           M550 489 C526 506 502 511 485 508"
