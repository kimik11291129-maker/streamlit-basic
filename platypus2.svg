<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfe9f7"/>
      <stop offset="100%" stop-color="#e5f8d6"/>
    </linearGradient>
    <radialGradient id="fur" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#9a6849"/>
      <stop offset="100%" stop-color="#5b3829"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="80" fill="url(#bg)"/>
  <ellipse cx="512" cy="845" rx="390" ry="92" fill="#79c8da" opacity="0.55"/>

  <!-- Tail -->
  <path d="M735 675
           C895 650 928 785 824 853
           C735 911 632 853 658 769
           C670 730 696 697 735 675Z"
