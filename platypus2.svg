  <!-- Nostril -->
  <ellipse cx="409" cy="458" rx="10" ry="7" fill="#7f4827"/>
  <ellipse cx="528" cy="458" rx="10" ry="7" fill="#7f4827"/>

  <!-- Cheeks -->
  <ellipse cx="329" cy="484" rx="32" ry="19" fill="#d88172" opacity="0.65"/>
  <ellipse cx="611" cy="484" rx="32" ry="19" fill="#d88172" opacity="0.65"/>

  <!-- Text -->
  <text x="512" y="963" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="42"
        font-weight="bold" fill="#3f5d45">PLATYPUS</text>
</svg>